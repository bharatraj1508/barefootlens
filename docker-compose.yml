services:
  web:
    build: .
    image: barefoot-lens
    # Host:container port both driven by PORT (default 3000). Override in .env
    # or inline: `PORT=8080 docker compose up`.
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    restart: unless-stopped
